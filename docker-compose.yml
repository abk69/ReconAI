services:
  db:
    # pgvector-enabled Postgres for M7.3 embeddings (drop-in replacement for postgres:16-alpine).
    # Same credentials / volume / port as before so existing DATABASE_URL keeps working.
    image: pgvector/pgvector:pg16
    container_name: reconai-postgres
    # Local defaults match .env.example. APP_ENV=demo must override POSTGRES_PASSWORD
    # in .env before the data volume is created. See .env.demo.example.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconai}
      POSTGRES_DB: ${POSTGRES_DB:-reconai}
    ports:
      - "5432:5432"
    volumes:
      - reconai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconai} -d ${POSTGRES_DB:-reconai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reconai_pgdata:
