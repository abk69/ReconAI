[project]
name = "reconai"
version = "0.1.0"
description = "Intelligent procurement reconciliation and exception-resolution platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "google-genai>=1.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: live Google Gemini API tests (requires GEMINI_API_KEY; excluded by default)",
    "live_embedding: live Gemini embedding tests (requires GEMINI_API_KEY; excluded by default)",
    "live_grounding: live grounded policy Gemini tests (requires GEMINI_API_KEY; excluded by default)",
    "live_rag_eval: live M7.5 RAG evaluation smoke (requires GEMINI_API_KEY; excluded by default)",
]
addopts = "-m 'not live_llm and not live_embedding and not live_grounding and not live_rag_eval'"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
